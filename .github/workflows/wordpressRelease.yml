name: Deploy Plugin to WordPress.org

on:
  workflow_dispatch:

env:
  PLUGIN_NAME: shipping-simulator-for-woocommerce
  PHP_VERSION: "7.4"
  DEPLOY_TAG: "2.5.0"

jobs:
  deploy-to-wp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch main
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Run composer install
        uses: php-actions/composer@v6
        with:
          php_version: ${{ env.PHP_VERSION }}
          working_dir: "."
          args: --ignore-platform-reqs
          command: install
          dev: no

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build assets
        run: |
          npm ci --no-progress
          npm run build

      - name: Prepare plugin folder
        run: |
          mkdir -p build/${{ env.PLUGIN_NAME }}
          mv ./assets ./classes ./core ./languages ./templates *.php *.txt LICENSE ./build/${{ env.PLUGIN_NAME }}
          cp -r vendor ./build/${{ env.PLUGIN_NAME }}/vendor
          find ./build -type f -exec chmod 0644 {} +
          find ./build -type d -exec chmod 0755 {} +

      - name: Deploy para WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          VERSION: ${{ env.DEPLOY_TAG }}
          SLUG: shipping-simulator-for-woocommerce
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          ASSETS_DIR: .wordpress-org
          BUILD_DIR: build/${{ env.PLUGIN_NAME }}
